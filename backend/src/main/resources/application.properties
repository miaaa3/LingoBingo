# Secrets & DB come from the environment / backend/.env (see .env.example). No secrets in this file.
secret.key=${SECRET_KEY}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/QuizDB}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

server.port=${SERVER_PORT:8081}
server.address=0.0.0.0

# 'update' evolves the schema without wiping data. Use 'create' only against a throwaway dev DB.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Comma-separated list of allowed frontend origins.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
