services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: lingobingo
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DB_URL: "jdbc:mysql://db:3306/lingobingo?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC"
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JPA_DDL_AUTO: update
      JPA_SHOW_SQL: "false"
      CORS_ALLOWED_ORIGINS: "http://localhost:${FRONTEND_PORT:-8088}"
      SERVER_PORT: "8081"
    # The backend is reached through the frontend's nginx /api proxy over the
    # internal Docker network, so it needs no host port. To call the API
    # directly (e.g. Postman), uncomment and pick a free host port:
    # ports:
    #   - "8082:8081"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    restart: unless-stopped

volumes:
  dbdata:
