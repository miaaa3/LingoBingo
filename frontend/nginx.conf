server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular single-page-app routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API calls to the backend container.
    # Resolve the hostname lazily via Docker's embedded DNS so nginx starts
    # even if the backend isn't up yet (it boots after MySQL).
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $upstream_backend backend:8081;
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
