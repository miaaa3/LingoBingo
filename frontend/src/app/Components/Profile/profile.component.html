<div class="page" style="max-width:40rem">
  <div class="page-head">
    <h1 class="page-title">My profile</h1>
    <p class="page-sub">Your account details — update your name and username any time.</p>
  </div>

  <div *ngIf="loading" class="text-gray-400 dark:text-gray-500">Loading…</div>

  <div *ngIf="!loading && profile" class="card p-6">
    <!-- identity header -->
    <div class="flex items-center gap-4 pb-6 mb-6 border-b border-gray-100 dark:border-[#2a2f47]">
      <app-avatar [name]="name || profile.email" [size]="72"></app-avatar>
      <div>
        <div class="display text-xl font-bold text-cloud-burst-900 dark:text-gray-100">{{ name || '—' }}</div>
        <span class="inline-block mt-1 text-xs font-bold px-2.5 py-1 rounded-full bg-blue-ribbon-50 dark:bg-[#232842] text-blue-ribbon-700 dark:text-blue-ribbon-300">{{ profile.role }}</span>
      </div>
    </div>

    <!-- editable fields -->
    <label class="block text-sm font-semibold text-cloud-burst-900 dark:text-gray-200 mb-1">Name</label>
    <input [(ngModel)]="name" class="w-full mb-4 rounded-xl border border-gray-200 dark:border-[#2a2f47] bg-gray-50 dark:bg-[#141829] text-cloud-burst-900 dark:text-gray-100 px-3 py-2.5 outline-none focus:border-blue-ribbon-400">

    <label class="block text-sm font-semibold text-cloud-burst-900 dark:text-gray-200 mb-1">Username</label>
    <input [(ngModel)]="username" class="w-full mb-4 rounded-xl border border-gray-200 dark:border-[#2a2f47] bg-gray-50 dark:bg-[#141829] text-cloud-burst-900 dark:text-gray-100 px-3 py-2.5 outline-none focus:border-blue-ribbon-400">

    <label class="block text-sm font-semibold text-cloud-burst-900 dark:text-gray-200 mb-1">Email</label>
    <input [value]="profile.email" readonly class="w-full mb-1 rounded-xl border border-gray-200 dark:border-[#2a2f47] bg-gray-100 dark:bg-[#0f1222] text-gray-500 dark:text-gray-400 px-3 py-2.5 outline-none cursor-not-allowed">
    <p class="text-xs text-gray-400 dark:text-gray-500 mb-5">Your email is used to sign in and can't be changed here.</p>

    <div class="flex items-center gap-3 flex-wrap">
      <button type="button" (click)="save()" [disabled]="!dirty || saving"
        class="bg-blue-ribbon-600 hover:bg-blue-ribbon-700 text-white font-bold px-6 py-2.5 rounded-full transition-colors disabled:opacity-50">
        {{ saving ? 'Saving…' : 'Save changes' }}
      </button>
      <a routerLink="/Reset-password" class="font-semibold text-blue-ribbon-600 dark:text-blue-ribbon-300 hover:underline">Change password</a>
      <span *ngIf="memberSince()" class="ml-auto text-xs text-gray-400 dark:text-gray-500">Member since {{ memberSince() }}</span>
    </div>
  </div>
</div>
