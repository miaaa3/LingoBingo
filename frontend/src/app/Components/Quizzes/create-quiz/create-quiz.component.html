<div class="relative min-h-screen py-16 px-4 sm:px-12 lg:px-48 bg-[#f6f7fb] dark:bg-[#141829]">
  <div class="flex justify-between items-center mt-4 mb-8 gap-3 flex-wrap">
    <div>
      <h1 class="text-xl font-bold text-gray-700 dark:text-gray-100">Create a new quiz</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">{{ questionsArray.length }} question(s) · {{ totalPoints() }} total points</p>
    </div>
    <button type="button" [disabled]="!quizForm.valid || saving" (click)="onSubmit()"
      [class.bg-blue-ribbon-600]="quizForm.valid && !saving" [class.bg-gray-300]="!quizForm.valid || saving"
      class="text-white px-5 py-2.5 rounded-lg font-semibold">{{ saving ? 'Saving...' : 'Create' }}</button>
  </div>

  <form [formGroup]="quizForm">
    <div class="grid sm:grid-cols-2 gap-5">
      <input class="w-full h-11 rounded-lg shadow-sm p-2.5 bg-white dark:bg-[#191d31] text-cloud-burst-900 dark:text-gray-100 placeholder:font-medium focus:outline-none focus:border-b-perano-400 focus:border-b-2"
        type="text" formControlName="name" placeholder="Enter a title / name for your quiz ...">
      <input class="w-full h-11 rounded-lg shadow-sm p-2.5 bg-white dark:bg-[#191d31] text-cloud-burst-900 dark:text-gray-100 placeholder:font-medium focus:outline-none focus:border-b-perano-400 focus:border-b-2"
        type="text" formControlName="description" placeholder="Enter a description for your quiz ...">
    </div>

    <label class="flex items-center gap-2 mt-4 text-sm text-gray-600 dark:text-gray-400 select-none w-fit">
      <input type="checkbox" formControlName="isPublic" class="w-4 h-4 accent-blue-ribbon-600"> Public quiz
    </label>

    <!-- Questions -->
    <div class="mt-12" formArrayName="questions" cdkDropList (cdkDropListDropped)="onQuestionDrop($event)">
      <div class="bg-white dark:bg-[#191d31] rounded-lg shadow-sm mb-4 py-3" *ngFor="let question of questionsArray; let i = index" [formGroupName]="i" cdkDrag>

        <div class="flex justify-between items-center border-b border-gray-100 dark:border-[#2a2f47] py-3 px-4 text-gray-400">
          <h1 class="font-bold text-lg text-cloud-burst-900 dark:text-gray-200">Question {{ i + 1 }}</h1>
          <div class="flex items-center gap-3">
            <div class="flex items-center gap-1 bg-mustard-100 dark:bg-[#3a3115] rounded-full px-3 py-1">
              <input type="number" min="1" formControlName="points" class="w-12 bg-transparent text-mustard-800 dark:text-mustard-300 font-bold text-sm text-center outline-none">
              <span class="text-xs text-mustard-700 dark:text-mustard-400">pts</span>
            </div>
            <svg class="size-5 cursor-grab" cdkDragHandle aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 7h14M5 12h14M5 17h14"/></svg>
            <svg class="size-5 cursor-pointer hover:text-red-500" (click)="deleteQuestion(i)" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M8.6 2.6A2 2 0 0 1 10 2h4a2 2 0 0 1 2 2v2h3a1 1 0 1 1 0 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8a1 1 0 0 1 0-2h3V4c0-.5.2-1 .6-1.4ZM10 6h4V4h-4v2Zm1 4a1 1 0 1 0-2 0v8a1 1 0 1 0 2 0v-8Zm4 0a1 1 0 1 0-2 0v8a1 1 0 1 0 2 0v-8Z" clip-rule="evenodd"/></svg>
          </div>
        </div>

        <div class="px-5 py-4">
          <div class="grid sm:grid-cols-2 gap-5">
            <div>
              <label class="block mb-2 font-medium text-gray-900 dark:text-gray-200">Question</label>
              <input type="text" placeholder="Enter question" formControlName="question"
                class="bg-gray-50 dark:bg-[#141829] border border-gray-300 dark:border-[#2a2f47] text-gray-900 dark:text-gray-100 text-sm rounded-lg focus:ring-blue-ribbon-500 focus:border-blue-ribbon-500 block w-full h-11 p-2.5">
            </div>
            <div>
              <label class="block mb-2 font-medium text-gray-900 dark:text-gray-200">Description <span class="text-gray-400 font-normal">(optional)</span></label>
              <input type="text" placeholder="Enter description" formControlName="description"
                class="bg-gray-50 dark:bg-[#141829] border border-gray-300 dark:border-[#2a2f47] text-gray-900 dark:text-gray-100 text-sm rounded-lg focus:ring-blue-ribbon-500 focus:border-blue-ribbon-500 block w-full h-11 p-2.5">
            </div>
          </div>

          <!-- Answer options: text + pick the correct one -->
          <label class="block mt-5 mb-2 font-medium text-gray-900 dark:text-gray-200">Answers <span class="text-gray-400 font-normal text-sm">— select the correct one</span></label>
          <div class="grid sm:grid-cols-2 gap-3" formGroupName="answers">
            <div *ngFor="let key of optionKeys"
              class="flex items-center gap-2 border rounded-lg px-3 py-2 transition-colors"
              [ngClass]="question.get('correctAnswer')?.value === key ? 'border-green-400 bg-green-50 dark:bg-[#0f2a1a] dark:border-green-600' : 'border-gray-300 dark:border-[#2a2f47]'">
              <input type="radio" [value]="key" [formControl]="$any(question.get('correctAnswer'))" class="w-4 h-4 accent-green-500 shrink-0">
              <span class="display text-xs font-bold text-gray-400 w-3">{{ key }}</span>
              <input type="text" [formControlName]="key" [placeholder]="key === 'A' || key === 'B' ? 'Required' : 'Optional'"
                class="flex-1 bg-transparent text-sm text-gray-900 dark:text-gray-100 outline-none min-w-0">
            </div>
          </div>

          <div class="mt-5 grid sm:grid-cols-2 gap-4">
            <div>
              <label class="block mb-2 font-medium text-gray-900 dark:text-gray-200">Explanation <span class="text-gray-400 font-normal">(optional)</span></label>
              <input type="text" placeholder="Why is this the answer?" formControlName="explanation"
                class="bg-gray-50 dark:bg-[#141829] border border-gray-300 dark:border-[#2a2f47] text-gray-900 dark:text-gray-100 text-sm rounded-lg focus:ring-blue-ribbon-500 focus:border-blue-ribbon-500 block w-full p-2.5">
            </div>
            <div>
              <label class="block mb-2 font-medium text-gray-900 dark:text-gray-200">Tip <span class="text-gray-400 font-normal">(optional)</span></label>
              <input type="text" placeholder="A hint for students" formControlName="tip"
                class="bg-gray-50 dark:bg-[#141829] border border-gray-300 dark:border-[#2a2f47] text-gray-900 dark:text-gray-100 text-sm rounded-lg focus:ring-blue-ribbon-500 focus:border-blue-ribbon-500 block w-full p-2.5">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="flex justify-center bg-white dark:bg-[#191d31] p-6 rounded-lg shadow-sm cursor-pointer" (click)="addNewQuestion()">
      <div class="text-base uppercase font-bold border-b-4 border-cyan-400 p-1 hover:text-yellow-400 hover:border-yellow-400 text-cloud-burst-900 dark:text-gray-200">+ Add Question</div>
    </div>

    <button type="button" [disabled]="!quizForm.valid || saving" (click)="onSubmit()"
      [class.bg-blue-ribbon-600]="quizForm.valid && !saving" [class.bg-gray-400]="!quizForm.valid || saving"
      class="text-white mt-8 px-5 py-2.5 rounded-lg font-semibold">{{ saving ? 'Saving...' : 'Create' }}</button>
  </form>
</div>
