<nav class="flex justify-between items-center gap-6 px-6 py-3.5 fixed z-10 w-full bg-white dark:bg-[#191d31] border-b border-gray-100 dark:border-[#2a2f47]">
  <a routerLink="/Home" class="display text-[1.6rem] leading-none font-extrabold text-cloud-burst-900 dark:text-gray-100">
    Lingo<span class="text-blue-ribbon-600">Bingo</span>
  </a>

  <div class="flex gap-2 items-center">
    <!-- Theme toggle -->
    <button type="button" (click)="toggleTheme()" title="Toggle dark mode" aria-label="Toggle dark mode"
      class="flex items-center justify-center size-9 rounded-full border border-gray-200 dark:border-[#2a2f47] text-cloud-burst-950 dark:text-[#e8ebf7] hover:bg-gray-100 dark:hover:bg-[#232842] transition-colors">
      <svg *ngIf="theme.current !== 'dark'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg *ngIf="theme.current === 'dark'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
    </button>

    <!-- Notifications -->
    <div *ngIf="isUser | async" class="relative">
      <button type="button" (click)="toggleDropdownNotification($event)" aria-label="Notifications"
        class="relative flex items-center justify-center size-10 rounded-full border border-gray-200 dark:border-[#2a2f47] text-cloud-burst-950 dark:text-[#e8ebf7] hover:bg-gray-100 dark:hover:bg-[#232842] transition-colors">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span *ngIf="unread > 0" class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[10px] font-bold flex items-center justify-center">{{ unread > 9 ? '9+' : unread }}</span>
      </button>
      <div *ngIf="openForNotification" [@dropdownAnimation]="'visible'" (click)="$event.stopPropagation()"
        class="absolute right-0 mt-2 w-80 origin-top-right rounded-2xl border border-gray-100 dark:border-[#2a2f47] bg-white dark:bg-[#191d31] shadow-xl overflow-hidden">
        <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100 dark:border-[#2a2f47]">
          <span class="font-bold text-cloud-burst-900 dark:text-gray-100">Notifications</span>
          <button *ngIf="notifications.length && unread > 0" type="button" (click)="markAllRead()"
            class="text-xs font-semibold text-blue-ribbon-600 dark:text-blue-ribbon-300 hover:underline">Mark all read</button>
        </div>

        <div *ngIf="notifLoading" class="px-4 py-8 text-center text-sm text-gray-400 dark:text-gray-500">Loading…</div>

        <div *ngIf="!notifLoading && notifications.length === 0" class="px-4 py-8 text-center text-sm text-gray-400 dark:text-gray-500">
          <svg class="w-8 h-8 mx-auto mb-2 opacity-60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          You're all caught up.
        </div>

        <div *ngIf="!notifLoading && notifications.length > 0" class="max-h-96 overflow-y-auto">
          <button *ngFor="let n of notifications" type="button" (click)="openNotification(n)"
            class="w-full text-left flex gap-3 px-4 py-3 border-b border-gray-50 dark:border-[#232842] hover:bg-gray-50 dark:hover:bg-[#232842] transition-colors"
            [class.bg-blue-ribbon-50]="!n.read" [class.dark:bg-transparent]="!n.read">
            <span class="mt-1.5 w-2 h-2 rounded-full shrink-0" [ngClass]="n.read ? 'bg-transparent' : 'bg-blue-ribbon-500'"></span>
            <span class="min-w-0">
              <span class="block text-sm text-cloud-burst-900 dark:text-gray-100" [class.font-semibold]="!n.read">{{ n.message }}</span>
              <span class="block text-xs text-gray-400 dark:text-gray-500 mt-0.5">{{ n.createdAt | date:'MMM d, h:mm a' }}</span>
            </span>
          </button>
        </div>
      </div>
    </div>

    <!-- Create (+) -->
    <div class="relative">
      <button type="button" (click)="toggleDropdown($event)" aria-label="Create"
        class="flex items-center justify-center size-10 rounded-full bg-blue-ribbon-600 hover:bg-blue-ribbon-700 text-white transition-colors">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <div *ngIf="open" [@dropdownAnimation]="'visible'" (click)="$event.stopPropagation()"
        class="absolute right-0 mt-2 w-60 origin-top-right rounded-2xl border border-gray-100 dark:border-[#2a2f47] bg-white dark:bg-[#191d31] shadow-xl overflow-hidden py-1">
        <a (click)="closeDropdown()" routerLink="/Create-quiz" class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-cloud-burst-900 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#232842] transition-colors">
          <span class="text-blue-ribbon-600">＋</span> New quiz
        </a>
        <a (click)="closeDropdown()" routerLink="/Quizzes/generate" class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-cloud-burst-900 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#232842] transition-colors">
          <span class="text-mauve-500">✦</span> Generate quiz from flashcards
        </a>
        <a (click)="closeDropdown()" routerLink="/Create-flashcard" class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-cloud-burst-900 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#232842] transition-colors">
          <span class="text-mustard-500">▤</span> New flashcard set
        </a>
      </div>
    </div>

    <!-- Profile -->
    <div *ngIf="isUser | async" class="relative">
      <button type="button" (click)="toggleDropdownProfile($event)" aria-label="Account" class="flex rounded-full focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700">
        <app-avatar [name]="displayName || email" [size]="38"></app-avatar>
      </button>
      <div *ngIf="openForProfile" [@dropdownAnimation]="'visible'" (click)="$event.stopPropagation()"
        class="absolute right-0 mt-2 w-64 origin-top-right rounded-2xl border border-gray-100 dark:border-[#2a2f47] bg-white dark:bg-[#191d31] shadow-xl overflow-hidden">
        <div class="flex items-center gap-3 px-4 py-3 border-b border-gray-100 dark:border-[#2a2f47]">
          <app-avatar [name]="displayName || email" [size]="40"></app-avatar>
          <div class="min-w-0">
            <div class="font-bold text-sm text-cloud-burst-900 dark:text-gray-100 truncate">{{ displayName || 'My account' }}</div>
            <div class="text-xs text-gray-400 dark:text-gray-500 truncate">{{ email }}</div>
          </div>
        </div>
        <div class="py-1">
          <a (click)="closeDropdownProfile()" routerLink="/Profile" class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-cloud-burst-900 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#232842] transition-colors">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            My profile
          </a>
          <a (click)="closeDropdownProfile()" routerLink="/Reset-password" class="flex items-center gap-3 px-4 py-2.5 text-sm font-medium text-cloud-burst-900 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-[#232842] transition-colors">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            Change password
          </a>
          <button type="button" (click)="logout()" class="w-full flex items-center gap-3 px-4 py-2.5 text-sm font-semibold text-red-500 hover:bg-red-50 dark:hover:bg-[#2a1416] transition-colors border-t border-gray-100 dark:border-[#2a2f47]">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Log out
          </button>
        </div>
      </div>
    </div>

    <!-- Logged out -->
    <div class="flex gap-2" *ngIf="!(isUser | async)">
      <button routerLink="/Login" class="py-2 px-4 rounded-full hover:bg-gray-100 dark:hover:bg-[#232842] text-cloud-burst-900 dark:text-gray-200 text-sm font-semibold">Log in</button>
      <button routerLink="/Register" class="py-2 px-4 rounded-full bg-mustard-400 hover:bg-mustard-300 text-sm text-cloud-burst-950 font-bold">Sign up</button>
    </div>
  </div>
</nav>
