<section class="bg-gray-100 dark:bg-[#232842] p-6">
  <div class="container mx-auto max-w-4xl">
    <div class="text-center mb-6">
      <h2 class="text-3xl font-bold text-gray-900 dark:text-gray-100">Live Game Leaderboard</h2>
      <p class="text-lg text-gray-500 dark:text-gray-400">Leaderboard updates every 5 seconds.</p>
    </div>

    <div class="overflow-x-auto bg-white dark:bg-[#191d31] rounded-lg shadow-lg">
      <table class="min-w-full table-auto">
        <thead>
          <tr class="bg-gray-200 text-left">
            <th class="px-4 py-2 font-medium text-gray-700 dark:text-gray-300">Avatar</th>
            <th class="px-4 py-2 font-medium text-gray-700 dark:text-gray-300">Name</th>
            <th class="px-4 py-2 font-medium text-gray-700 dark:text-gray-300">Score</th>
          </tr>
        </thead>
        <tbody>
          <!-- Loop through leaderboard players -->
          <tr *ngFor="let player of joinedPlayers" class="border-b hover:bg-gray-100 dark:bg-[#232842]">
            <app-avatar [name]="player.username" [size]="40"></app-avatar>
            <td class="px-4 py-2 text-gray-800 dark:text-gray-200">{{ player.username}}</td>
            <td class="px-4 py-2 text-gray-800 dark:text-gray-200">{{ player.score }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Real-time update text -->
    <div class="mt-6 text-center" *ngIf="gameEnded">
      <p class="text-lg font-semibold text-gray-600 dark:text-gray-300">Leaderboard is updating...</p>
    </div>
  </div>
</section>
