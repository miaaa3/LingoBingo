<div class="max-w-4xl mx-auto">
  <div class="flex justify-between items-center mb-6 gap-3 flex-wrap">
    <h1 class="text-2xl font-extrabold text-cloud-burst-900 dark:text-gray-100 display">Create a set of flashcards</h1>
    <button type="button" [disabled]="!flashcardSetForm.valid" (click)="createFlashcardSet()"
      [class.bg-blue-ribbon-600]="flashcardSetForm.valid" [class.bg-gray-300]="!flashcardSetForm.valid"
      class="text-white px-5 py-2.5 rounded-lg font-semibold">Create</button>
  </div>

  <form [formGroup]="flashcardSetForm" (ngSubmit)="createFlashcardSet()">
    <div class="grid sm:grid-cols-2 gap-4">
      <input class="w-full h-11 rounded-lg shadow-sm p-2.5 bg-white dark:bg-[#191d31] text-cloud-burst-900 dark:text-gray-100 placeholder:font-medium focus:outline-none focus:border-b-perano-400 focus:border-b-2"
        type="text" formControlName="name" placeholder="Enter a title / name for your set ...">
      <input class="w-full h-11 rounded-lg shadow-sm p-2.5 bg-white dark:bg-[#191d31] text-cloud-burst-900 dark:text-gray-100 placeholder:font-medium focus:outline-none focus:border-b-perano-400 focus:border-b-2"
        type="text" formControlName="description" placeholder="Enter a description for your set ...">
    </div>

    <!-- Language pair: powers auto-translate + the practice mode -->
    <div class="mt-4 flex items-center gap-3 flex-wrap bg-perano-50 dark:bg-[#20233a] rounded-xl p-3">
      <span class="text-sm font-semibold text-cloud-burst-900 dark:text-gray-200">Translate:</span>
      <select formControlName="sourceLang" class="rounded-lg border border-gray-200 dark:border-[#2a2f47] bg-white dark:bg-[#141829] text-cloud-burst-900 dark:text-gray-100 px-3 py-2 text-sm">
        <option *ngFor="let l of languages" [value]="l.code">{{ l.flag }} {{ l.name }}</option>
      </select>
      <button type="button" (click)="swapLanguages()" title="Swap languages"
        class="w-9 h-9 rounded-lg flex items-center justify-center bg-white dark:bg-[#141829] border border-gray-200 dark:border-[#2a2f47] text-blue-ribbon-600 hover:bg-blue-ribbon-50 dark:hover:bg-[#232842]">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
      </button>
      <select formControlName="targetLang" class="rounded-lg border border-gray-200 dark:border-[#2a2f47] bg-white dark:bg-[#141829] text-cloud-burst-900 dark:text-gray-100 px-3 py-2 text-sm">
        <option *ngFor="let l of languages" [value]="l.code">{{ l.flag }} {{ l.name }}</option>
      </select>
      <span class="text-xs text-gray-500 dark:text-gray-400">Type a term and we'll suggest the translation.</span>
    </div>

    <!-- Cards -->
    <div class="mt-8" formArrayName="flashcards" cdkDropList (cdkDropListDropped)="onQuestionDrop($event)">
      <div class="bg-white dark:bg-[#191d31] rounded-lg shadow-sm mb-4" *ngFor="let flashcard of flashcardsArray; let i = index" [formGroupName]="i" cdkDrag>
        <div class="flex justify-between items-center border-b border-gray-100 dark:border-[#2a2f47] py-3 px-4 text-gray-400">
          <h1 class="font-bold text-lg text-cloud-burst-900 dark:text-gray-200">{{ i + 1 }}</h1>
          <div class="flex items-center gap-3">
            <svg class="size-5 cursor-grab" cdkDragHandle aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" stroke-width="2" d="M5 7h14M5 12h14M5 17h14"/></svg>
            <svg class="size-5 cursor-pointer hover:text-red-500" (click)="deleteCard(i)" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M8.6 2.6A2 2 0 0 1 10 2h4a2 2 0 0 1 2 2v2h3a1 1 0 1 1 0 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8a1 1 0 0 1 0-2h3V4c0-.5.2-1 .6-1.4ZM10 6h4V4h-4v2Zm1 4a1 1 0 1 0-2 0v8a1 1 0 1 0 2 0v-8Zm4 0a1 1 0 1 0-2 0v8a1 1 0 1 0 2 0v-8Z" clip-rule="evenodd"/></svg>
          </div>
        </div>

        <div class="px-5 py-4">
          <div class="grid sm:grid-cols-2 gap-4">
            <input class="w-full h-11 p-2.5 rounded-lg bg-gray-50 dark:bg-[#141829] text-cloud-burst-900 dark:text-gray-100 border border-transparent focus:border-yellow-400 focus:outline-none"
              type="text" placeholder="Term (e.g. strawberries)" formControlName="term">
            <div>
              <input class="w-full h-11 p-2.5 rounded-lg bg-gray-50 dark:bg-[#141829] text-cloud-burst-900 dark:text-gray-100 border border-transparent focus:border-yellow-400 focus:outline-none"
                type="text" placeholder="Definition / translation (e.g. fraise)" formControlName="definition">

              <!-- live translation suggestion -->
              <div *ngIf="isTranslating(flashcard)" class="mt-1.5 text-xs text-gray-400 dark:text-gray-500 flex items-center gap-1.5">
                <span class="inline-block w-3 h-3 border-2 border-blue-ribbon-400 border-t-transparent rounded-full animate-spin"></span> translating...
              </div>
              <div *ngIf="!isTranslating(flashcard) && suggestionFor(flashcard) as sug"
                class="mt-1.5 flex items-center gap-2 flex-wrap text-sm">
                <span class="text-gray-500 dark:text-gray-400">💡 Suggested:</span>
                <button type="button" (click)="acceptSuggestion(flashcard)"
                  class="font-semibold text-blue-ribbon-700 dark:text-blue-ribbon-300 bg-blue-ribbon-50 dark:bg-[#232842] px-2.5 py-1 rounded-full hover:bg-blue-ribbon-100">
                  {{ sug }} <span class="text-xs text-gray-400">— use</span>
                </button>
                <button type="button" (click)="dismissSuggestion(flashcard)" class="text-gray-300 hover:text-red-400" title="Dismiss">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="flex justify-center bg-white dark:bg-[#191d31] p-6 rounded-lg shadow-sm cursor-pointer" (click)="addNewCard()">
      <div class="text-base uppercase font-bold border-b-4 border-cyan-400 p-1 hover:text-yellow-400 hover:border-yellow-400 text-cloud-burst-900 dark:text-gray-200">+ Add Card</div>
    </div>
  </form>
</div>
