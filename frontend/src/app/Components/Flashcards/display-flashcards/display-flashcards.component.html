<div *ngIf="flashcardSet" class="max-w-2xl mx-auto">
  <div *ngIf="flashcards.length === 0" class="text-center text-gray-400 dark:text-gray-500 py-12">
    This set has no cards yet.
  </div>

  <ng-container *ngFor="let flashcard of flashcards; let i = index">
    <div *ngIf="i === currentFlashcardIndex">
      <!-- 3D flip card -->
      <div class="flip-card" (click)="flipFlashcard(flashcard)">
        <div class="flip-card-inner" [class.flipped]="flashcard.flipped">
          <div class="flip-card-face card">
            <span class="face-label">term</span>
            <div class="face-text display">{{ flashcard.term }}</div>
            <span class="tap-hint">tap to flip</span>
          </div>
          <div class="flip-card-face flip-card-back card">
            <span class="face-label">translation</span>
            <div class="face-text display">{{ flashcard.definition }}</div>
            <span class="tap-hint">tap to flip back</span>
          </div>
        </div>
      </div>

      <!-- progress + navigation -->
      <div class="flex items-center justify-center gap-6 mt-6">
        <button type="button" class="nav-btn" (click)="goToPreviousFlashcard()" [disabled]="currentFlashcardIndex === 0" aria-label="Previous">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 19-7-7 7-7"/></svg>
        </button>
        <span class="text-sm font-semibold text-gray-500 dark:text-gray-400">{{ currentFlashcardIndex + 1 }} / {{ flashcards.length }}</span>
        <button type="button" class="nav-btn" (click)="goToNextFlashcard()" [disabled]="currentFlashcardIndex === flashcards.length - 1" aria-label="Next">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></svg>
        </button>
      </div>
    </div>
  </ng-container>
</div>
